name: Release

# Push a tag "v<version>" matching package.json to publish to npm and create a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Trusted publishing (OIDC) to npm with provenance, and creating the GitHub release.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # npm >= 11.5 is required for trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache-dependency-path: npm-shrinkwrap.json

      - name: Verify tag, version and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm run test:coverage

      # prepack rebuilds dist; provenance is enabled through publishConfig.
      - run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
